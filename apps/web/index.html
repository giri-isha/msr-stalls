<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ⚠️ `viewport-fit=cover` so `env(safe-area-inset-*)` reports real
         numbers. Installed and full screen, an iPhone's home indicator sits
         over the bottom of the page, and every `safe-area-inset-bottom` in the
         module — the bottom sheet, the update toast — resolves to 0 without
         it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Stalls</title>

    <!-- The colour of the browser chrome around the app, and of the splash
         while it launches. `--pri` converted from oklch — see the note in
         vite.config.ts; a manifest has no notion of a theme, so this is the
         light one either way. -->
    <meta name="theme-color" content="#372aac" />

    <!-- ⚠️ iOS reads NONE of the web manifest for the home-screen icon. It
         wants this link, at 180px, or it screenshots the page and uses that. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <meta name="apple-mobile-web-app-title" content="Stalls" />

    <script>
      // Apply the saved (or system) theme before paint to avoid a flash.
      //
      // The module's tokens follow `.dark` on <html> (see ui/tokens.css) rather
      // than keeping a theme of their own, so this one line drives the whole
      // palette — and it has to run before the bundle, or every visitor in dark
      // mode gets one white frame.
      //
      // The key is the one the host uses, so a module mounted inside it inherits
      // the choice instead of arguing with it.
      (function () {
        try {
          var stored = localStorage.getItem('stalls-theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
